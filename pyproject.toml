[project]
name = "silwright"
version = "0.1.3"
description = "Generate C++ code from declarative node descriptions."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Silvan Wegmann" },
]
maintainers = [
    { name = "Silvan Wegmann" },
]
keywords = ["ast", "code-generation", "cpp", "schema", "tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
license-files = ["LICENSE"]
dependencies = [
    "lark>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/Jokymon/silwright"
Repository = "https://github.com/Jokymon/silwright.git"
Issues = "https://github.com/Jokymon/silwright/issues"
Changelog = "https://github.com/Jokymon/silwright/blob/master/CHANGELOG.md"

[project.scripts]
silwright = "silwright.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]
docs = [
    "mkdocs>=1.6.1,<2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["silwright"]
