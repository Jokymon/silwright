name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest

      - name: Run Ruff checks
        run: uv run --no-sync ruff check .

      - name: Run strict Mypy checks
        run: uv run --no-sync mypy

  vscode-extension:
    name: VS Code extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode/silwright-ndef-language-support
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run extension tests
        run: npm test
